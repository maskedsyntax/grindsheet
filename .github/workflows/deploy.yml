name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"

      - run: gleam deps download

      - run: gleam test

      - run: node --test worker/progress.test.mjs

      - run: gleam run -m catalog_build

      - run: gleam run -m lustre/dev build --minify --outdir=dist

      - run: printf '%s\n' grindsheet.maskedsyntax.com > dist/CNAME && touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
